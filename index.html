<!-- Home / landing page. The actual order form now lives at order.html and
     opens in a new tab from the "Order Now" button below, so the root URL
     can serve as a simple front door instead of jumping straight to the form. -->
<!DOCTYPE html>
<html lang="fil">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Siomai D'</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --accent: #C9A24B;
    --dark: #2B1610;
    --bg: #FDF8F0;
    --muted: #7A5C3A;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    font-family: 'Inter', Helvetica, Arial, sans-serif;
    color: var(--dark);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .hero {
    max-width: 420px;
    width: 100%;
    text-align: center;
  }

  .logo {
    max-width: 96px;
    max-height: 96px;
    margin: 0 auto 18px;
    border-radius: 14px;
    display: none;
  }

  .shop-name {
    font-family: 'Playfair Display', Georgia, serif;
    font-size: 36px;
    font-weight: 700;
    color: var(--dark);
    letter-spacing: 0.3px;
  }

  .shop-tagline {
    font-size: 14px;
    color: var(--muted);
    margin-top: 6px;
    letter-spacing: 0.3px;
  }

  .divider {
    width: 40px;
    height: 2px;
    background: var(--accent);
    margin: 22px auto;
  }

  .hours {
    font-size: 13px;
    color: var(--muted);
    line-height: 1.7;
    margin-bottom: 30px;
  }

  .hours strong { color: var(--dark); }

  .order-btn {
    display: inline-block;
    background: var(--dark);
    color: var(--bg);
    font-family: 'Inter', Helvetica, sans-serif;
    font-weight: 700;
    font-size: 16px;
    text-decoration: none;
    padding: 16px 40px;
    border-radius: 999px;
    border: 2px solid var(--dark);
    transition: background 0.2s, color 0.2s;
  }

  .order-btn:hover {
    background: transparent;
    color: var(--dark);
  }

  .order-btn .arrow {
    display: inline-block;
    margin-left: 8px;
    transition: transform 0.2s;
  }

  .order-btn:hover .arrow { transform: translateX(3px); }

  .footnote {
    margin-top: 22px;
    font-size: 11px;
    color: var(--muted);
    opacity: 0.7;
  }
</style>
</head>
<body>

<div class="hero">
  <img class="logo" id="shopLogo" src="" alt="">
  <div class="shop-name" id="shopNameHeading">Siomai D'</div>
  <div class="shop-tagline" id="shopTagline">Meaning of being hungry</div>

  <div class="divider"></div>

  <div class="hours" id="hoursText">
    Open <strong>Mon–Wed</strong>, 12:00 PM – 9:00 PM<br>
    Delivery &amp; Pickup available
  </div>

  <a class="order-btn" id="orderBtn" href="order.html" target="_blank" rel="noopener">
    Order Now <span class="arrow">→</span>
  </a>

  <div class="footnote">Opens in a new tab</div>
</div>

<script>
/* ============================================================
   SHOP CONFIG — keep in sync with order.html / admin.html.
   ============================================================ */
const SHOP_NAME = "Siomai D'";
const SHOP_TAGLINE = 'Meaning of being hungry';
const SHOP_LOGO_URL = ''; // paste an image URL here, or leave '' for text-only
/* ============================================================
   END SHOP CONFIG
   ============================================================ */

document.title = SHOP_NAME;
document.getElementById('shopNameHeading').textContent = SHOP_NAME;
document.getElementById('shopTagline').textContent = SHOP_TAGLINE;

if (SHOP_LOGO_URL) {
  const logoEl = document.getElementById('shopLogo');
  logoEl.src = SHOP_LOGO_URL;
  logoEl.alt = SHOP_NAME + ' logo';
  logoEl.style.display = 'inline-block';
}
</script>
</body>
</html>
