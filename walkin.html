<!-- Standalone Walk-in Order (POS) page. Separated from admin.html so counter
     staff have a focused, uncluttered screen for quickly logging walk-in
     sales, without the full order-management dashboard around it.
     Uses the same Accounts login + Apps Script backend as admin.html. -->
<!DOCTYPE html>
<html lang="fil">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Siomai D' — Walk-in Order</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --accent: #C9A24B;
    --bg-page: #1a1008;
    --bg-card: #2B1610;
    --bg-input: #3A2015;
    --text: #F3E7C9;
    --text-muted: #B79A6E;
    --border: #5C4326;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg-page);
    font-family: 'Inter', Helvetica, Arial, sans-serif;
    min-height: 100vh;
    color: var(--text);
  }

  header {
    background: var(--bg-card);
    border-bottom: 2px solid var(--accent);
    padding: 14px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
  }

  header .brand { font-family: 'Playfair Display', Georgia, serif; font-size: 20px; color: var(--accent); }
  header .sub { font-size: 11px; color: var(--text-muted); letter-spacing: 2px; text-transform: uppercase; }

  .back-link {
    font-size: 13px;
    color: var(--text-muted);
    text-decoration: none;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 14px;
  }
  .back-link:hover { border-color: var(--accent); color: var(--accent); }

  .wrap {
    max-width: 560px;
    margin: 0 auto;
    padding: 20px 16px 60px;
  }

  .login-screen {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 26px 22px;
  }

  .login-card { width: 100%; max-width: 340px; }
  .login-card .brand { font-family: 'Playfair Display', Georgia, serif; font-size: 24px; color: var(--accent); }
  .login-card .sub { font-size: 11px; color: var(--text-muted); letter-spacing: 2px; text-transform: uppercase; }

  .field { margin-bottom: 12px; }
  .field label {
    display: block;
    font-size: 11px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 6px;
  }

  input[type="text"], input[type="password"] {
    width: 100%;
    background: var(--bg-input);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-family: 'Inter', Helvetica, sans-serif;
    font-size: 16px; /* 16px avoids iOS auto-zoom on focus */
    padding: 12px 14px;
    outline: none;
    transition: border-color 0.2s;
  }
  input:focus { border-color: var(--accent); }
  input::placeholder { color: #7a6040; }

  .primary-btn {
    background: var(--accent);
    border: none;
    color: var(--bg-page);
    font-family: 'Inter', Helvetica, sans-serif;
    font-weight: bold;
    font-size: 15px;
    padding: 14px;
    border-radius: 8px;
    cursor: pointer;
    width: 100%;
    transition: opacity 0.15s;
  }
  .primary-btn:hover { opacity: 0.9; }
  .primary-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .ghost-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-muted);
    font-family: 'Inter', Helvetica, sans-serif;
    font-size: 13px;
    padding: 10px;
    border-radius: 8px;
    cursor: pointer;
  }
  .ghost-btn:hover { border-color: var(--accent); color: var(--accent); }

  .error-text {
    font-size: 12px;
    color: #e06060;
    margin-top: 8px;
    min-height: 14px;
  }

  .success-toast {
    background: rgba(91,207,138,0.15);
    border: 1px solid #5BCF8A;
    color: #5BCF8A;
    border-radius: 8px;
    padding: 12px 16px;
    font-size: 14px;
    margin-bottom: 16px;
    display: none;
  }

  .section-label {
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--text-muted);
    margin: 20px 0 10px;
  }

  .item-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    margin-bottom: 10px;
    gap: 12px;
  }

  .item-row .info .name { font-size: 15px; color: var(--text); font-weight: 600; }
  .item-row .info .price { font-size: 12px; color: var(--text-muted); margin-top: 2px; }

  .qty-control {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-shrink: 0;
  }

  .qty-btn {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    border: 1px solid var(--accent);
    background: transparent;
    color: var(--accent);
    font-size: 20px;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    -webkit-tap-highlight-color: transparent;
  }
  .qty-btn:active { background: rgba(201,162,75,0.25); }

  .qty-num {
    font-size: 17px;
    font-weight: bold;
    color: var(--text);
    min-width: 22px;
    text-align: center;
  }

  .total-bar {
    position: sticky;
    bottom: 0;
    background: var(--bg-card);
    border-top: 2px solid var(--accent);
    border-radius: 10px 10px 0 0;
    padding: 16px 18px;
    margin-top: 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .total-bar .label { font-size: 12px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }
  .total-bar .value { font-family: 'Playfair Display', Georgia, serif; font-size: 28px; color: var(--accent); font-weight: bold; }

  .recent-list {
    margin-top: 24px;
  }

  .recent-row {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    color: var(--text-muted);
    padding: 7px 0;
    border-bottom: 1px solid rgba(92,67,38,0.4);
  }
  .recent-row .r-name { color: var(--text); }
  .recent-row .r-total { color: var(--accent); font-weight: bold; }
</style>
</head>
<body>

<div class="login-screen" id="loginScreen">
  <div class="card login-card">
    <div class="brand" style="text-align:center; margin-bottom:2px;" id="loginBrand">Siomai D' 🧾</div>
    <div class="sub" style="text-align:center; margin-bottom:20px;">Walk-in Order</div>
    <div class="field">
      <input type="text" id="loginUsername" placeholder="Username" autocomplete="username">
    </div>
    <div style="height:10px"></div>
    <div class="field">
      <input type="password" id="loginPassword" placeholder="Password" autocomplete="current-password">
    </div>
    <div class="error-text" id="loginError"></div>
    <button class="primary-btn" id="loginBtn" style="margin-top:10px;" onclick="attemptLogin()">Log In</button>
  </div>
</div>

<div id="posWrap" style="display:none;">
  <header>
    <div>
      <div class="brand" id="posBrand">Siomai D' 🧾</div>
      <div class="sub">Walk-in Order</div>
    </div>
    <a class="back-link" href="admin.html">← Admin Dashboard</a>
  </header>

  <div class="wrap">
    <div class="success-toast" id="successToast">✅ Na-save ang order!</div>

    <div class="section-label">Customer (optional)</div>
    <div class="field">
      <input type="text" id="wkName" placeholder="Walk-in Customer">
    </div>

    <div class="section-label">Items</div>
    <div id="wkItemsList"></div>

    <div class="section-label">Note (optional)</div>
    <div class="field">
      <input type="text" id="wkNote" placeholder="e.g. extra sauce">
    </div>

    <div class="error-text" id="wkError"></div>

    <div class="total-bar">
      <div>
        <div class="label">Total</div>
        <div class="value" id="wkTotal">₱0</div>
      </div>
      <button class="primary-btn" id="wkSubmitBtn" style="width:auto; padding:14px 26px;" onclick="submitWalkinOrder()">Save Order</button>
    </div>

    <div class="recent-list">
      <div class="section-label">Kanina lang (session na ito)</div>
      <div id="recentList" style="font-size:13px; color:var(--text-muted); font-style:italic;">Wala pang order.</div>
    </div>
  </div>
</div>

<script>
/* ============================================================
   SHOP CONFIG — keep in sync with order.html / admin.html.
   ============================================================ */
const SHOP_NAME = "Siomai D'";
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzB2IajsTUZ6-bWDQjJbu9KLyZ1KrGIj09O7pD7xmYqPFSBj_QhQ092J7thBTocSuo2/exec';

const MENU = [
  { id: 'pork', name: 'Pork Siomai', note: 'per piece', price: 11 },
  { id: 'chicken', name: 'Chicken Siomai', note: 'per piece', price: 11 },
  { id: 'japanese', name: 'Japanese Siomai', note: 'per piece', price: 13 },
  { id: 'rice', name: 'Plain Rice', note: 'per order', price: 15 },
];
/* ============================================================
   END SHOP CONFIG
   ============================================================ */

document.title = SHOP_NAME + ' — Walk-in Order';
document.getElementById('loginBrand').textContent = SHOP_NAME + ' 🧾';
document.getElementById('posBrand').textContent = SHOP_NAME + ' 🧾';

let currentUser = null;
let wkQty = {};
let sessionOrders = [];

MENU.forEach(m => wkQty[m.id] = 0);

function attemptLogin() {
  const username = document.getElementById('loginUsername').value.trim();
  const password = document.getElementById('loginPassword').value;
  const errEl = document.getElementById('loginError');
  const btn = document.getElementById('loginBtn');

  errEl.textContent = '';
  if (!username || !password) {
    errEl.textContent = 'Pakilagay ang username at password.';
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Nag-che-check...';

  fetch(SCRIPT_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ action: 'login', username, password })
  })
    .then(res => res.json())
    .then(data => {
      if (!data.ok) throw new Error(data.error || 'Invalid login');
      currentUser = { username: data.username, role: data.role };
      localStorage.setItem('siomaiAdminUser', JSON.stringify(currentUser));
      enterPOS();
    })
    .catch(err => {
      errEl.textContent = err.message === 'Invalid username or password'
        ? 'Mali ang username o password.'
        : 'Hindi ma-verify. Subukan ulit.';
    })
    .finally(() => {
      btn.disabled = false;
      btn.textContent = 'Log In';
    });
}

function enterPOS() {
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('posWrap').style.display = 'block';
  renderItems();
}

// Reuses the same login session as admin.html - if staff is already
// logged into the dashboard on this device, this page skips straight in.
(function checkExistingSession() {
  const saved = localStorage.getItem('siomaiAdminUser');
  if (saved) {
    try {
      currentUser = JSON.parse(saved);
      enterPOS();
    } catch (e) {
      localStorage.removeItem('siomaiAdminUser');
    }
  }
})();

function renderItems() {
  const list = document.getElementById('wkItemsList');
  list.innerHTML = '';
  MENU.forEach(item => {
    const row = document.createElement('div');
    row.className = 'item-row';
    row.innerHTML = `
      <div class="info">
        <div class="name">${item.name}</div>
        <div class="price">₱${item.price} ${item.note}</div>
      </div>
      <div class="qty-control">
        <button class="qty-btn" onclick="wkChangeQty('${item.id}',-1)">−</button>
        <span class="qty-num" id="wkqty_${item.id}">${wkQty[item.id]}</span>
        <button class="qty-btn" onclick="wkChangeQty('${item.id}',1)">+</button>
      </div>`;
    list.appendChild(row);
  });
  updateWkTotal();
}

function wkChangeQty(id, delta) {
  wkQty[id] = Math.max(0, wkQty[id] + delta);
  document.getElementById('wkqty_' + id).textContent = wkQty[id];
  updateWkTotal();
}

function updateWkTotal() {
  const total = MENU.reduce((s, m) => s + m.price * wkQty[m.id], 0);
  document.getElementById('wkTotal').textContent = '₱' + total;
}

function resetWkForm() {
  MENU.forEach(m => wkQty[m.id] = 0);
  document.getElementById('wkName').value = '';
  document.getElementById('wkNote').value = '';
  renderItems();
}

function renderRecentList() {
  const el = document.getElementById('recentList');
  if (!sessionOrders.length) {
    el.innerHTML = 'Wala pang order.';
    return;
  }
  el.innerHTML = sessionOrders.slice().reverse().map(o =>
    `<div class="recent-row"><span class="r-name">${o.name}</span><span class="r-total">₱${o.total}</span></div>`
  ).join('');
}

function submitWalkinOrder() {
  const errEl = document.getElementById('wkError');
  errEl.textContent = '';

  const items = MENU.filter(m => wkQty[m.id] > 0).map(m => ({
    id: m.id, name: m.name, price: m.price, qty: wkQty[m.id], subtotal: m.price * wkQty[m.id]
  }));

  if (!items.length) {
    errEl.textContent = 'Pumili ng kahit isang item.';
    return;
  }

  const name = document.getElementById('wkName').value.trim() || 'Walk-in Customer';
  const note = document.getElementById('wkNote').value.trim();
  const total = items.reduce((s, i) => s + i.subtotal, 0);

  const btn = document.getElementById('wkSubmitBtn');
  btn.disabled = true;
  btn.textContent = 'Sinesave...';

  fetch(SCRIPT_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({
      action: 'create',
      username: currentUser.username,
      role: currentUser.role,
      order: {
        name: name,
        mode: 'walkin',
        note: note,
        items: items,
        total: total,
        status: 'Delivered' // walk-in sale is already completed at the counter
      }
    })
  })
    .then(res => res.json())
    .then(data => {
      if (!data.ok) throw new Error(data.error || 'Unknown error');
      sessionOrders.push({ name, total });
      renderRecentList();
      resetWkForm();
      const toast = document.getElementById('successToast');
      toast.style.display = 'block';
      setTimeout(() => { toast.style.display = 'none'; }, 2500);
    })
    .catch(err => {
      errEl.textContent = err.message || 'Hindi na-save. Subukan ulit.';
    })
    .finally(() => {
      btn.disabled = false;
      btn.textContent = 'Save Order';
    });
}
</script>
</body>
</html>
